<!DOCTYPE html>
<html>
<head>
    <title>Precision Agriculture AI</title>
</head>
<body>
    <h1>🌱 Smart Irrigation System</h1>

    <label>Temperature:</label>
    <input id="temp" type="number"><br><br>

    <label>Rainfall:</label>
    <input id="rainfall" type="number"><br><br>

    <label>Soil Type:</label>
    <select id="soil">
        <option value="sandy">Sandy</option>
        <option value="clay">Clay</option>
    </select><br><br>

    <label>Crop Type:</label>
    <input id="crop" type="text"><br><br>

    <button onclick="predict()">Predict</button>

    <h2 id="result"></h2>

    <script>
        function predict() {
            const temp = document.getElementById("temp").value;
            const rainfall = document.getElementById("rainfall").value;
            const soil = document.getElementById("soil").value;
            const crop = document.getElementById("crop").value;
fetch("http://127.0.0.1:8000/predict", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        temp: parseFloat(temp),
        rainfall: parseFloat(rainfall),
        soil_type: soil,
        crop_type: crop
    })
})
.then(response => response.json())
.then(data => {
    const result = `Water: ${data.water_liters_per_day} L/day | Risk: ${data.risk_level}`;
    document.getElementById("result").innerText = result;
})
.catch(error => {
    document.getElementById("result").innerText = "Error connecting to API";
});
            document.getElementById("result").innerText = result;
        }
    </script>
</body>
</html>
